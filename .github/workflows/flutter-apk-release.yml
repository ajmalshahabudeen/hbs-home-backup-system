name: flutter-apk-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hbs-app-flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD."
            echo "Create the persistent keystore once and upload secrets (see android/keystore/README.md)."
            exit 1
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/hbs-release.jks
          {
            echo "storeFile=keystore/hbs-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=${ANDROID_KEY_ALIAS:-hbscloud}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Name APK
        id: artifact
        run: |
          TAG="${GITHUB_REF_NAME}"
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          DEST="hbs-cloud-${TAG}.apk"
          cp "$SRC" "$DEST"
          VERSION="${TAG#v}"
          printf '{"version":"%s","tag":"%s","apk":"https://github.com/ajmalshahabudeen/hbs-home-backup-system/releases/download/%s/%s"}\n' "$VERSION" "$TAG" "$TAG" "$DEST" > latest.json
          echo "file=$DEST" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HBS Cloud ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            apps/hbs-app-flutter/hbs-cloud-${{ github.ref_name }}.apk
            apps/hbs-app-flutter/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
